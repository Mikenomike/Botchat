name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and locate project
        run: |
          zipfile="$(ls *.zip | head -1)"
          echo "Using: $zipfile"
          unzip -q "$zipfile" -d proj
          find proj -maxdepth 3 | head -40
          settings="$(find proj -name settings.gradle.kts | head -1)"
          if [ -z "$settings" ]; then echo "settings.gradle.kts not found in zip"; exit 1; fi
          echo "PROJ=$(dirname "$settings")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: cd "$PROJ" && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BotChat-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
